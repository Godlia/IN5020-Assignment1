#
#   docker compose --profile all build             # build images once (IN5020-Assignment1-group2-assigment1)
#   docker compose --profile proxy up              # start one example; Ctrl+C stops it
#   docker compose --profile proxy down            # remove its containers and network
#   bash scripts/test-all.sh                       # run every example and report OK/FAIL
#   bash scripts/test-all.sh proxy server          # ...or only some
#
# Profiles: proxy server client (and "all")
# A service with a profile is ignored unless that profile is enabled, so a plain `docker compose up` starts nothing.
#
# Every Java service uses the one image built from ./Dockerfile. The image's entrypoint is
# `run <main class> [args]` (docker/run.sh), so `command:` is just the main class and its arguments.
#  This should be changed I think?: Container names double as host names on the compose network: 

#
#   docker compose --profile all build             # Build images once (IN5020-Assignment1-group2)
#   docker compose --profile proxy up              # Start the proxy server
#   docker compose --profile all up                # Start proxy, 5 zone servers, and client
#   bash scripts/test-all.sh                       # Run every service profile and report OK/FAIL
#
# Profiles: proxy, server, client, all
# Every Java service uses the single image built from ./Dockerfile. 
# The image's entrypoint is `run <main class> [args]` (docker/run.sh).

name: IN5020-Assignment1-group2

# ---- reusable fragments (YAML anchors; keys starting with x- are ignored by compose) ----
# Each image is BUILT by exactly one service (proxy server and client, see *build-runAss1);
# every other service only USES the image. If every service had its own `build:`, then
# `docker compose --profile all build` would run ~ identical builds in parallel that all race to tag the
# same name, and Docker Desktop fails with: image "dockertest-runAss1:latest": already exists.
# ---- reusable fragments ----
x-image: &assignment1
  image: in5020-assignment1

x-build: &build-assignment1
  build:
    context: .
    target: runtime

x-health: &health            # common timing for all healthchecks; each service adds its own `test`
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 30s
  start_interval: 1s         # check every second while starting (Docker Engine 25+)

services:
  # ======================= PROXY SERVER =======================
  proxy:
    <<: [*assignment1, *build-assignment1]       
    profiles: [proxy, all]
    # Replace with your actual proxy main class if different
    command: ["com.group2.server.Server", "PROXY"]
    environment:
      JAVA_OPTS: -Djava.rmi.server.hostname=proxy
    ports: ["1099:1099", "1100:1100"]
    healthcheck: { <<: *health, test: ["CMD", "listening", "1099"] }
  # ======================= ZONE SERVERS =======================
  server-zone1:                                      
    <<: *assignment1
    profiles: [server, all]
    # Passing Zone 1 as an argument (adapt to your Server class args)
    command: ["com.group2.server.Server", "ZONE", "1", "proxy"]
    environment:
      # The host name the server writes INTO its stubs - must be resolvable by the clients
      JAVA_OPTS: -Djava.rmi.server.hostname=server-zone1
    depends_on:
      proxy: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "listening", "1099"] }  

  server-zone2:                                      
    <<: *assignment1
    profiles: [server, all]
    command: ["com.group2.server.Server", "ZONE", "2", "proxy"]
    environment:
       # The host name the server writes INTO its stubs - must be resolvable by the clients
      JAVA_OPTS: -Djava.rmi.server.hostname=server-zone2
    depends_on:
      proxy: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "listening", "1099"] } 
  
  server-zone3:                                      
    <<: *assignment1
    profiles: [server, all]
    command: ["com.group2.server.Server", "ZONE", "3", "proxy"]
    environment:
       # The host name the server writes INTO its stubs - must be resolvable by the clients
      JAVA_OPTS: -Djava.rmi.server.hostname=server-zone3
    depends_on:
      proxy: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "listening", "1099"] }

  server-zone4:                                      
    <<: *assignment1
    profiles: [server, all]
    command: ["com.group2.server.Server", "ZONE", "4", "proxy"]
    environment:
       # The host name the server writes INTO its stubs - must be resolvable by the clients
      JAVA_OPTS: -Djava.rmi.server.hostname=server-zone4
    depends_on:
      proxy: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "listening", "1099"] }

  server-zone5:                                      
    <<: *assignment1
    profiles: [server, all]
    command: ["com.group2.server.Server", "ZONE", "5", "proxy"]
    environment:
       # The host name the server writes INTO its stubs - must be resolvable by the clients
      JAVA_OPTS: -Djava.rmi.server.hostname=server-zone5
    depends_on:
      proxy: { condition: service_healthy }
    healthcheck: { <<: *health, test: ["CMD", "listening", "1099"] }

  # ======================= CLIENT =======================
  client:                                   
    <<: *assignment1
    profiles: [client, all]
    # Client will parse exercise_1_input.txt and connect to the proxy
    command: ["com.group2.client.Client", "proxy"]
    depends_on:
      server-zone1: { condition: service_healthy }
      server-zone2: { condition: service_healthy }
      server-zone3: { condition: service_healthy }
      server-zone4: { condition: service_healthy }
      server-zone5: { condition: service_healthy }