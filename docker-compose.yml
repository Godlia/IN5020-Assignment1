name: IN5020

services:
  proxy:
    build: .
    environment:
      APP_ROLE: proxy
    ports:
      - "${PROXY_PORT:-1099}:1099"
    healthcheck:
      test: ["CMD", "java", "-cp", "/in5020/target/assignment1.jar", "com.group2.proxy.ProxyHealthCheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    

  serverA:
    build: .
    image: in5020-servera
    environment:
      APP_ROLE: server
      SERVER_HOST: serverA
      CACHE_TYPE: "${CACHE_TYPE:-NAIVE}"
      QUEUE_LOG_FILE: /in5020/output/${RUN_NAME}/serverA-queue.log
      CACHE_MODE: "${SERVER_CACHE_MODE:-NAIVE}"
      CACHE_POLICY: "${CACHE_POLICY:-LRU}"
    volumes:
      - ./output:/in5020/output:rw
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/in5020/target/assignment1.jar", "com.group2.server.ServerHealthCheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  serverB:
    build: .
    image: in5020-serverb
    environment:
      APP_ROLE: server
      SERVER_HOST: serverB
      CACHE_TYPE: "${CACHE_TYPE:-NAIVE}"
