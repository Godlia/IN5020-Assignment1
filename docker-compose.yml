      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s


  client:
    build: .
    environment:
      APP_ROLE: client
      QUERY_FILE: /in5020/exercise_1_input.txt
      OUTPUT_FILE: /in5020/output/${RUN_NAME}/client-output.txt
      CLIENT_DELAY_MS: "${CLIENT_DELAY_MS:-20}"
      CACHE_MODE: "${CACHE_TYPE:-NAIVE}"
    volumes:
      - ./exercise_1_input.txt:/in5020/exercise_1_input.txt:ro
      - ./output:/in5020/output:rw
    depends_on:
      proxy:
        condition: service_healthy
      serverA:
        condition: service_healthy
      serverB:
        condition: service_healthy
      serverC:
        condition: service_healthy
      serverD:
        condition: service_healthy
      serverE:
        condition: service_healthy